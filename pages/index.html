<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A 股方向研究、多源覆盖与多源强势分析">
    <title>A 股方向研究</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <div>
          <h1>A 股方向研究</h1>
          <p id="run-meta" class="run-meta">正在载入最新数据</p>
        </div>
        <nav class="downloads" aria-label="数据下载">
          <a href="./data/direction_analysis.csv" download>分析 CSV</a>
          <a href="./data/direction_evidence.csv" download>证据 CSV</a>
          <a href="./data/manifest.json" download>运行清单</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="overview" aria-labelledby="overview-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">LATEST SNAPSHOT</p>
            <h2 id="overview-title">全量方向概览</h2>
          </div>
          <span id="health-badge" class="health-badge">载入中</span>
        </div>
        <div class="metrics">
          <div class="metric"><span>完整证据</span><strong id="metric-evidence">-</strong></div>
          <div class="metric"><span>聚合方向</span><strong id="metric-analysis">-</strong></div>
          <div class="metric"><span>多源强势</span><strong id="metric-strong">-</strong></div>
          <div class="metric"><span>多源覆盖</span><strong id="metric-coverage">-</strong></div>
          <div class="metric"><span>有效来源</span><strong id="metric-sources">-</strong></div>
        </div>
        <div id="health-message" class="health-message" role="status"></div>
      </section>

      <section class="section" aria-labelledby="sources-title">
        <div class="section-heading">
          <h2 id="sources-title">来源状态</h2>
          <span id="scope-label" class="section-meta"></span>
        </div>
        <div class="source-layout">
          <div id="source-bars" class="source-bars" aria-label="各来源记录数量"></div>
          <div class="table-shell">
            <table>
              <thead><tr><th>来源</th><th>状态</th><th>记录</th><th>范围</th><th>尝试</th><th>提交</th></tr></thead>
              <tbody id="source-body"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="section" aria-labelledby="references-title">
        <div class="section-heading">
          <h2 id="references-title">方法参考</h2>
        </div>
        <div class="table-shell">
          <table>
            <thead><tr><th>仓库</th><th>用途</th><th>运行时请求</th><th>状态</th><th>提交</th></tr></thead>
            <tbody id="reference-body"></tbody>
          </table>
        </div>
      </section>

      <section class="section" aria-labelledby="strong-title">
        <div class="section-heading">
          <h2 id="strong-title">多源强势</h2>
          <a class="text-link" href="./data/multi_source_strong.csv" download>下载结果</a>
        </div>
        <div class="table-shell">
          <table>
            <thead><tr><th>方向</th><th>强势来源</th><th>覆盖来源</th><th>范围</th><th>状态</th></tr></thead>
            <tbody id="strong-body"></tbody>
          </table>
        </div>
      </section>

      <section class="section" aria-labelledby="coverage-title">
        <div class="section-heading">
          <div>
            <h2 id="coverage-title">多源覆盖</h2>
            <p class="section-meta">包含多源强势方向</p>
          </div>
          <a class="text-link" href="./data/multi_source_coverage.csv" download>下载结果</a>
        </div>
        <div class="table-shell">
          <table>
            <thead><tr><th>方向</th><th>覆盖来源</th><th>强势来源</th><th>范围</th><th>状态</th></tr></thead>
            <tbody id="coverage-body"></tbody>
          </table>
        </div>
      </section>

      <section class="section analysis-section" aria-labelledby="analysis-title">
        <div class="section-heading">
          <h2 id="analysis-title">完整方向分析</h2>
          <span id="result-count" class="section-meta" aria-live="polite"></span>
        </div>
        <div class="filters" aria-label="方向筛选">
          <label class="search-field">
            <span>搜索</span>
            <input id="search-input" type="search" placeholder="方向名称" autocomplete="off">
          </label>
          <label>
            <span>分类</span>
            <select id="classification-filter">
              <option value="all">全部</option>
              <option value="multi_source_strong">多源强势</option>
              <option value="multi_source_coverage">多源覆盖</option>
              <option value="single_source">单一来源</option>
            </select>
          </label>
          <label>
            <span>来源</span>
            <select id="source-filter"><option value="all">全部</option></select>
          </label>
          <label>
            <span>范围</span>
            <select id="universe-filter"><option value="all">全部</option></select>
          </label>
          <label>
            <span>排序</span>
            <select id="sort-select">
              <option value="default">综合证据</option>
              <option value="strong">强势来源数</option>
              <option value="coverage">覆盖来源数</option>
              <option value="name">方向名称</option>
            </select>
          </label>
        </div>
        <div class="table-shell analysis-table">
          <table>
            <thead>
              <tr><th>#</th><th>方向</th><th>分类</th><th>覆盖来源</th><th>强势来源</th><th>范围</th><th>状态</th><th>质量标记</th></tr>
            </thead>
            <tbody id="analysis-body"></tbody>
          </table>
        </div>
        <div class="pagination">
          <button id="previous-page" type="button">上一页</button>
          <span id="page-label"></span>
          <button id="next-page" type="button">下一页</button>
        </div>
      </section>
    </main>

    <footer>
      <span>Business-Unit-for-Stock / stock-research</span>
      <span>仅用于研究，不构成投资建议</span>
    </footer>
    <script src="./app.js" defer></script>
  </body>
</html>
