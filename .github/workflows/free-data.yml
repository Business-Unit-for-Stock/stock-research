name: Free market data snapshot

on:
  workflow_call:
    inputs:
      start_date:
        required: false
        type: string
      end_date:
        required: false
        type: string
      providers:
        required: false
        default: "akshare,yfinance"
        type: string
      adjust:
        required: false
        default: none
        type: string
  workflow_dispatch:
    inputs:
      start_date:
        description: "开始日期，格式 YYYYMMDD；留空默认最近 30 天"
        required: false
        type: string
      end_date:
        description: "结束日期，格式 YYYYMMDD；留空默认今天"
        required: false
        type: string
      providers:
        description: "数据源，逗号分隔：akshare,yfinance"
        required: false
        default: "akshare,yfinance"
        type: string
      adjust:
        description: "AKShare 复权方式：none、qfq 或 hfq"
        required: false
        default: none
        type: choice
        options:
          - none
          - qfq
          - hfq
  schedule:
    - cron: "30 10 * * 1-5"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research code
        uses: actions/checkout@v4
        with:
          repository: Business-Unit-for-Stock/stock-research
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned organization forks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install \
            "git+https://github.com/Business-Unit-for-Stock/akshare.git@main" \
            "git+https://github.com/Business-Unit-for-Stock/yfinance.git@main"
      - name: Fetch free snapshot
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          PROVIDERS: ${{ inputs.providers || 'akshare,yfinance' }}
          ADJUST: ${{ inputs.adjust || 'none' }}
        run: |
          args=(--symbols config/symbols.txt --providers "$PROVIDERS" --output-dir data/snapshot --per-symbol-timeout 45)
          if [ -n "$START_DATE" ]; then args+=(--start-date "$START_DATE"); fi
          if [ -n "$END_DATE" ]; then args+=(--end-date "$END_DATE"); fi
          args+=(--adjust "$ADJUST")
          python scripts/fetch_free_data.py "${args[@]}"
      - name: Upload snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-data-${{ github.run_id }}
          path: data/snapshot
          if-no-files-found: error
          retention-days: 30
