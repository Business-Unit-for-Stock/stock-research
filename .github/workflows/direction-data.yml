name: Direction data snapshot

on:
  workflow_call:
    inputs:
      days:
        required: false
        default: 20
        type: number
  workflow_dispatch:
    inputs:
      days:
        description: "板块轮动回溯交易日：10、20、30 或 50"
        required: false
        default: "20"
        type: choice
        options: ["10", "20", "30", "50"]
  schedule:
    - cron: "35 10 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: direction-pages
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout research orchestrator
        uses: actions/checkout@v7
        with:
          repository: Business-Unit-for-Stock/stock-research
          ref: main
      - name: Checkout organization Forks
        uses: actions/checkout@v7
        with:
          repository: Business-Unit-for-Stock/akshare
          ref: main
          path: .external/akshare
          persist-credentials: false
      - name: Checkout direction source Fork
        uses: actions/checkout@v7
        with:
          repository: Business-Unit-for-Stock/plate-rotation-skill
          ref: main
          path: .external/plate-rotation-skill
          persist-credentials: false
      - name: Checkout interface reference Fork
        uses: actions/checkout@v7
        with:
          repository: Business-Unit-for-Stock/a-stock-data
          ref: main
          path: .external/a-stock-data
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install organization modules
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -e .external/akshare
      - name: Fetch and normalize direction data
        env:
          DAYS: ${{ inputs.days || 20 }}
        run: |
          python scripts/fetch_direction_data.py \
            --output-dir data/direction \
            --plate-repo .external/plate-rotation-skill \
            --akshare-repo .external/akshare \
            --a-stock-data-repo .external/a-stock-data \
            --days "$DAYS"
      - name: Publish run summary
        if: always() && hashFiles('data/direction/summary.md') != ''
        run: cat data/direction/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Build public research page
        run: |
          python scripts/build_direction_pages.py \
            --data-dir data/direction \
            --output-dir build/pages \
            --require-complete
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages
      - name: Upload direction artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: direction-data-${{ github.run_id }}
          path: data/direction
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: snapshot
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Publish Pages URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "## 公开研究页面" >> "$GITHUB_STEP_SUMMARY"
          echo "$PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
